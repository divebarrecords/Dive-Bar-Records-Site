<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dive Bar Records - Under Construction</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 30%, #2a0a12 0%, #120005 60%, #050002 100%);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    color: #f5e9d8;
    text-align: center;
    padding: 24px;
    overflow: hidden;
  }
  .glow {
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(230,57,70,0.25) 0%, transparent 70%);
    filter: blur(10px);
    animation: pulse 5s ease-in-out infinite;
    z-index: 0;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50% { transform: scale(1.15); opacity: 1; }
  }
  .content {
    position: relative;
    z-index: 1;
    max-width: 560px;
  }
  h1 {
    font-size: clamp(1.8rem, 5vw, 3rem);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
    color: #f2b544;
    text-shadow: 0 0 20px rgba(242,181,68,0.4);
  }
  .subtitle {
    font-size: 1rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #e63946;
    margin-bottom: 2rem;
  }
  p {
    font-size: 1.05rem;
    line-height: 1.6;
    color: #d8c9b5;
    margin-bottom: 2rem;
  }
.logo {
    width: min(320px, 70vw);
    height: auto;
    margin-bottom: 1.5rem;
    -webkit-filter: invert(1);
    filter: invert(1) drop-shadow(0 0 25px rgba(242,181,68,0.55)) drop-shadow(0 0 50px rgba(230,57,70,0.25));
    animation: flicker 4s infinite;
  }
  @keyframes flicker {
    0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
      opacity: 1;
      filter: invert(1) drop-shadow(0 0 25px rgba(242,181,68,0.55)) drop-shadow(0 0 50px rgba(230,57,70,0.25));
    }
    20%, 22%, 24%, 55% {
      opacity: 0.6;

      filter: invert(1) drop-shadow(0 0 6px rgba(242,181,68,0.2)) drop-shadow(0 0 12px rgba(230,57,70,0.1));
    }
  }
  .contact {
    font-size: 0.9rem;
    color: #a89484;
  }
  a {
    color: #f2b544;
    text-decoration: none;
    border-bottom: 1px solid rgba(242,181,68,0.4);
  }
  a:hover {
    border-bottom-color: #f2b544;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="content">
    <img class="logo" src="https://raw.githubusercontent.com/divebarrecords/Dive-Bar-Records-Site/refs/heads/main/dive%20bar%20logo%20cropped.png" alt="Dive Bar Records logo">
    <div class="subtitle">Under Construction</div>
    <p>We're building something new, check back soon. <br> In the meantime, follow along for release updates and show announcements on <a href="https://www.instagram.com/divebarrecordsuk/">our Instagram</a>.</p>
    <div class="contact">Get in touch: <a href="mailto:info@divebarrecords.co.uk">info@divebarrecords.co.uk</a></div>
  </div>
</body>
</html>
