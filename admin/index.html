<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gigs Admin - DIVE BAR RECORDS</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.106.1"></script>
<style>
:root{
  --paper:#f8f7f3; --paper2:#F2EAD2; --ink:#232338;
  --gold:#D79922; --red:#F13C20; --blue:#4056A1;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:var(--paper); color:var(--ink);
  font-family:'Space Mono', monospace; font-size:0.92rem; line-height:1.5;
  min-height:100vh;
}
a{color:var(--red);}
h1{font-size:1.3rem; letter-spacing:-0.5px;}
h2{font-size:1rem; text-transform:uppercase; letter-spacing:1px; margin-bottom:14px;}

/* ---- login gate ---- */
#loginView{
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
}
.login-card{
  width:100%; max-width:340px; background:var(--paper2);
  border-radius:12px; padding:32px; box-shadow:4px 5px 0 var(--ink);
}
.login-card h1{ margin-bottom:6px; }
.login-card p.sub{ opacity:0.7; font-size:0.8rem; margin-bottom:22px; }
label{ display:block; font-weight:700; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px; }
input, select{
  width:100%; font:inherit; padding:10px 12px; margin-bottom:16px;
  border:2px solid var(--ink); border-radius:6px; background:var(--paper); color:var(--ink);
  color-scheme: light;
}
button{
  font:inherit; font-weight:700; text-transform:uppercase; letter-spacing:0.5px;
  background:var(--ink); color:var(--paper); border:none; border-radius:6px;
  padding:11px 18px; cursor:pointer; transition:background 0.2s ease;
}
button:hover{ background:var(--red); }
button:disabled{ opacity:0.4; cursor:default; }
button.secondary{ background:none; color:var(--ink); border:2px solid var(--ink); }
button.secondary:hover{ background:var(--ink); color:var(--paper); }
button.danger{ background:none; color:var(--red); border:2px solid var(--red); padding:6px 12px; font-size:0.72rem; }
button.danger:hover{ background:var(--red); color:var(--paper); }
.form-status{ font-size:0.78rem; min-height:1.2em; margin-top:-8px; margin-bottom:14px; color:var(--red); }

.ord{ border:2px solid var(--ink); border-radius:8px; padding:12px 14px; margin-bottom:12px; background:var(--paper); }
.ord.refunded{ opacity:0.6; }
.ord-top{ display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.ord small{ opacity:0.7; }
.ord-actions{ margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }
.ord-actions button, .tk button{ padding:5px 10px; font-size:0.7rem; }
.tk{ display:flex; align-items:center; gap:10px; margin-top:6px; font-size:0.82rem; flex-wrap:wrap; }
.tk code{ letter-spacing:1px; font-weight:700; }
.badge{ display:inline-block; font-size:0.68rem; font-weight:700; text-transform:uppercase; padding:2px 8px; border-radius:20px; border:2px solid var(--ink); }
.badge.good{ background:#d9efd5; } .badge.bad{ background:var(--red); color:var(--paper); border-color:var(--red); } .badge.wait{ background:var(--paper2); }
.ord-tools{ display:flex; gap:10px; align-items:flex-start; } .ord-tools input{ margin-bottom:0; }

/* ---- app shell ---- */
#appView{ display:none; min-height:100vh; }
#appView.is-visible{ display:block; }
.admin-header{
  display:flex; justify-content:space-between; align-items:center;
  padding:20px 5%; border-bottom:2px solid var(--ink); background:var(--paper2);
}
.admin-main{ padding:36px 5% 80px; max-width:820px; margin:0 auto; }

.panel{ background:var(--paper2); border-radius:12px; padding:26px; margin-bottom:32px; box-shadow:4px 5px 0 var(--gold); }
.field-grid{ display:grid; grid-template-columns:1fr 1fr; gap:0 16px; }
.field-grid .full{ grid-column:1 / -1; }
@media(max-width:560px){ .field-grid{ grid-template-columns:1fr; } }

/* inline checkbox + label (overrides the full-width form input styling) */
.toggle-row{ display:flex; align-items:center; gap:8px; cursor:pointer; margin:-4px 0 14px; opacity:0.8; }
.toggle-row input{ width:auto; margin:0; padding:0; accent-color:var(--ink); cursor:pointer; }
.scan-box{ max-width:420px; margin:0 0 14px; border:2px solid var(--ink); border-radius:8px; overflow:hidden; background:#000; line-height:0; }
.scan-box video{ width:100%; height:auto; display:block; }
.scan-actions{ display:flex; gap:10px; margin:0 0 14px; }
.scan-result{ border:2px solid var(--ink); border-radius:10px; padding:16px 18px; margin:0 0 18px; background:var(--paper); min-height:64px; }
.scan-result strong{ display:block; font-size:1.15rem; letter-spacing:0.5px; text-transform:uppercase; }
.scan-result span{ display:block; font-size:0.8rem; margin-top:4px; opacity:0.85; }
.scan-result.ok{ background:#d9efd5; }
.scan-result.warn{ background:var(--gold); }
.scan-result.bad{ background:var(--red); color:var(--paper); border-color:var(--red); }
.scan-count{ font-size:0.78rem; opacity:0.7; margin:12px 0 0; }
.gig-row{
  display:flex; justify-content:space-between; align-items:center; gap:16px;
  background:var(--paper); border:2px solid var(--ink); border-radius:8px;
  padding:14px 16px; margin-bottom:10px; flex-wrap:wrap;
}
.gig-row-main{ flex:1; min-width:200px; }
.gig-row-main strong{ display:block; font-size:0.95rem; }
.gig-row-main span{ display:block; font-size:0.75rem; opacity:0.7; margin-top:2px; }
.gig-row-actions{ display:flex; gap:8px; align-items:center; }
.gig-row-actions button{ padding:7px 12px; font-size:0.72rem; }
.tag{ font-size:0.68rem; font-weight:700; text-transform:uppercase; padding:3px 8px; border-radius:10px; }
.tag.soldout{ background:var(--red); color:var(--paper); }
.tag.low{ background:var(--gold); color:var(--ink); }
.empty-note{ opacity:0.6; font-size:0.85rem; padding:10px 0; }
</style>
</head>
<body>

<div id="loginView">
  <div class="login-card">
    <h1>GIGS ADMIN</h1>
    <p class="sub">Dive Bar Records - sign in to manage listings.</p>
    <form id="loginForm">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" required autocomplete="username">
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" required autocomplete="current-password">
      <p class="form-status" id="loginStatus" role="status" aria-live="polite"></p>
      <button type="submit" id="loginBtn">Log in</button>
    </form>
  </div>
</div>

<div id="appView">
  <div class="admin-header">
    <h1>GIGS ADMIN</h1>
    <button class="secondary" id="logoutBtn">Log out</button>
  </div>

  <div class="admin-main">
    <div class="panel">
      <h2 id="formTitle">Add a gig</h2>
      <form id="gigForm">
        <input type="hidden" id="gigId">
        <div class="field-grid">
          <div class="full">
            <label for="fHeadliner">Headliner</label>
            <input type="text" id="fHeadliner" required>
          </div>
          <div class="full">
            <label for="fSupport">Support / details</label>
            <input type="text" id="fSupport" placeholder="e.g. Dirty Word + guests">
          </div>
          <div>
            <label for="fDate">Date</label>
            <input type="date" id="fDate" required>
          </div>
          <div>
            <label for="fDoors">Doors</label>
            <input type="text" id="fDoors" placeholder="e.g. 7:30pm">
          </div>
          <div>
            <label for="fVenue">Venue</label>
            <input type="text" id="fVenue" required>
          </div>
          <div>
            <label for="fCity">City</label>
            <input type="text" id="fCity" required>
          </div>
          <div>
            <label for="fPrice">Price (£)</label>
            <input type="number" id="fPrice" min="0" step="0.5" required>
          </div>
          <div>
            <label for="fTickets">Capacity (total tickets)</label>
            <input type="number" id="fTickets" min="0" step="1" required>
          </div>
          <div class="full">
            <label for="fAge">Age restriction</label>
            <input type="text" id="fAge" placeholder="e.g. 14+, 18+, All ages">
          </div>
        </div>
        <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
        <button type="submit" id="saveBtn">Save gig</button>
        <button type="button" class="secondary" id="cancelEditBtn" style="display:none; margin-left:8px;">Cancel edit</button>
      </form>
    </div>

    <div class="panel">
      <h2>Upcoming gigs</h2>
      <label class="toggle-row"><input type="checkbox" id="showArchived"><span>Show archived gigs</span></label>
      <div id="gigList"><p class="empty-note">Loading…</p></div>
    </div>

    <div class="panel">
      <h2>Door scanner</h2>
      <label for="scanGig">Scanning for</label>
      <select id="scanGig"></select>
      <div class="scan-actions">
        <button type="button" class="secondary" id="scanStart">Start camera</button>
        <button type="button" class="secondary" id="scanStop" style="display:none">Stop camera</button>
      </div>
      <div class="scan-box" id="scanBox" style="display:none"><video id="scanVideo" playsinline muted></video></div>
      <div class="scan-result" id="scanResult" role="status" aria-live="polite"><strong>Ready</strong><span>Start the camera and point it at a ticket QR code.</span></div>
      <label for="scanManual">Or type a ticket code</label>
      <div class="ord-tools">
        <input type="text" id="scanManual" placeholder="e.g. A3F09C21B7D4E856" autocomplete="off" autocapitalize="characters" spellcheck="false">
        <button type="button" id="scanManualGo">Check in</button>
      </div>
      <p class="scan-count" id="scanCount"></p>
    </div>

    <div class="panel">
      <h2>Orders &amp; tickets</h2>
      <div class="ord-tools">
        <input type="search" id="orderSearch" placeholder="Search email, name, gig or ticket code" autocomplete="off">
        <button type="button" class="secondary" id="ordersRefresh">Refresh</button>
      </div>
      <p class="form-status" id="orderMsg" role="status" aria-live="polite" style="margin-top:10px"></p>
      <div id="orderList"><p class="empty-note">Loading…</p></div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://ualutedgenurromgylwz.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVhbHV0ZWRnZW51cnJvbWd5bHd6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMTIwNDEsImV4cCI6MjEwNTY4ODA0MX0.HrCUOmaC2Mjk8pp3Nxax2KNduy0_egW2wuJUmgpbLZg';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const loginView = document.getElementById('loginView');
const appView = document.getElementById('appView');
const loginForm = document.getElementById('loginForm');
const loginStatus = document.getElementById('loginStatus');
const loginBtn = document.getElementById('loginBtn');

function showApp(){
  loginView.style.display = 'none';
  appView.classList.add('is-visible');
  loadGigs();
  loadOrders();
}
function showLogin(){
  if (typeof stopScan === 'function') stopScan();
  appView.classList.remove('is-visible');
  loginView.style.display = 'flex';
}

// Restore session on load (so a refresh doesn't boot you back to login)
sb.auth.getSession().then(({ data }) => {
  if (data.session) showApp(); else showLogin();
});

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  loginBtn.disabled = true;
  loginStatus.textContent = '';
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  loginBtn.disabled = false;
  if (error) {
    loginStatus.textContent = error.message || 'Login failed - check your details.';
    return;
  }
  showApp();
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await sb.auth.signOut();
  showLogin();
});

// ---- gig form (shared by add + edit) ----
const gigForm = document.getElementById('gigForm');
const formTitle = document.getElementById('formTitle');
const formStatus = document.getElementById('formStatus');
const saveBtn = document.getElementById('saveBtn');
const cancelEditBtn = document.getElementById('cancelEditBtn');
const fIds = ['fHeadliner','fSupport','fDate','fDoors','fVenue','fCity','fPrice','fTickets','fAge'];

function resetForm(){
  document.getElementById('gigId').value = '';
  fIds.forEach(id => document.getElementById(id).value = '');
  formTitle.textContent = 'Add a gig';
  saveBtn.textContent = 'Save gig';
  cancelEditBtn.style.display = 'none';
  formStatus.textContent = '';
}
cancelEditBtn.addEventListener('click', resetForm);

function fillForm(gig){
  document.getElementById('gigId').value = gig.id;
  document.getElementById('fHeadliner').value = gig.headliner;
  document.getElementById('fSupport').value = gig.support || '';
  document.getElementById('fDate').value = gig.event_date;
  document.getElementById('fDoors').value = gig.doors_time || '';
  document.getElementById('fVenue').value = gig.venue;
  document.getElementById('fCity').value = gig.city;
  document.getElementById('fPrice').value = gig.price_gbp;
  document.getElementById('fTickets').value = gig.capacity ?? gig.tickets_remaining;
  document.getElementById('fAge').value = gig.age_restriction || '';
  formTitle.textContent = 'Edit gig';
  saveBtn.textContent = 'Update gig';
  cancelEditBtn.style.display = 'inline-block';
  formStatus.textContent = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

gigForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  saveBtn.disabled = true;
  formStatus.textContent = '';

  const id = document.getElementById('gigId').value;
  const payload = {
    headliner: document.getElementById('fHeadliner').value.trim(),
    support: document.getElementById('fSupport').value.trim() || null,
    event_date: document.getElementById('fDate').value,
    doors_time: document.getElementById('fDoors').value.trim() || null,
    venue: document.getElementById('fVenue').value.trim(),
    city: document.getElementById('fCity').value.trim(),
    price_gbp: Number(document.getElementById('fPrice').value),
    capacity: Number(document.getElementById('fTickets').value),
    age_restriction: document.getElementById('fAge').value.trim() || null
  };

  // Stock (tickets_remaining) is managed by the database: it starts equal to
  // capacity and only moves with sales or when capacity is changed.
  const { error } = id
    ? await sb.from('gigs').update(payload).eq('id', id)
    : await sb.from('gigs').insert({ ...payload, tickets_remaining: payload.capacity });

  saveBtn.disabled = false;
  if (error) {
    formStatus.textContent = error.message || 'Could not save - try again.';
    return;
  }
  resetForm();
  loadGigs();
});

// ---- orders & tickets (talks to the admin-orders edge function) ----
const ADMIN_API = SUPABASE_URL + '/functions/v1/admin-orders';
let orders = [];
const orderMsg = document.getElementById('orderMsg');
function esc(v){
  return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
async function adminCall(body){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) throw new Error('Please log in again.');
  const res = await fetch(ADMIN_API, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'apikey':SUPABASE_ANON_KEY, 'Authorization':'Bearer ' + session.access_token },
    body: JSON.stringify(body)
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('Request failed (' + res.status + ')'));
  return data;
}
async function loadOrders(){
  const el = document.getElementById('orderList');
  orderMsg.textContent = '';
  try {
    orders = (await adminCall({ action:'list' })).orders || [];
    renderOrders();
  } catch (err) {
    el.innerHTML = '<p class="empty-note">Couldn\u2019t load orders \u2014 ' + esc(err.message) + '</p>';
  }
}
function emailBadge(o){
  if (o.status !== 'paid') return '';
  const st = o.email_status;
  if (st === 'delivered') return '<span class="badge good">Email delivered</span>';
  if (st === 'bounced') return '<span class="badge bad">Email BOUNCED</span>';
  if (st === 'complained') return '<span class="badge bad">Marked as spam</span>';
  if (st === 'delivery_delayed') return '<span class="badge wait">Email delayed</span>';
  if (st) return '<span class="badge wait">Email sent</span>';
  return '<span class="badge wait">Email not tracked</span>';
}
function renderOrders(){
  const el = document.getElementById('orderList');
  const q = document.getElementById('orderSearch').value.trim().toLowerCase();
  const list = orders.filter(o => !q || [o.customer_email, o.customer_name, o.gigs?.headliner, ...(o.tickets||[]).map(t => t.code)]
    .some(v => String(v || '').toLowerCase().includes(q)));
  if (!list.length){ el.innerHTML = '<p class="empty-note">' + (orders.length ? 'No matching orders.' : 'No orders yet.') + '</p>'; return; }
  el.innerHTML = list.map(o => {
    const g = o.gigs || {};
    const total = ((o.unit_price_pence * o.quantity) / 100).toFixed(2);
    const when = new Date(o.paid_at || o.created_at).toLocaleString('en-GB', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
    const tickets = (o.tickets || []).map(t => {
      const state = t.voided_at ? '<span class="badge">Void</span>'
        : t.checked_in_at ? '<span class="badge good">Checked in</span> <button type="button" class="secondary" data-act="undo" data-ticket="' + esc(t.id) + '">Undo</button>'
        : '<button type="button" class="secondary" data-act="checkin" data-ticket="' + esc(t.id) + '">Check in</button>';
      return '<div class="tk"><code>' + esc(t.code) + '</code> ' + state + '</div>';
    }).join('');
    const actions = o.status === 'paid'
      ? '<div class="ord-actions">'
        + '<button type="button" class="secondary" data-act="resend" data-order="' + esc(o.id) + '">Resend email</button>'
        + '<button type="button" class="secondary" data-act="fix" data-order="' + esc(o.id) + '">Change email &amp; resend</button>'
        + '<button type="button" class="danger" data-act="refund" data-order="' + esc(o.id) + '">Refund</button></div>'
      : '';
    return '<div class="ord ' + esc(o.status) + '">'
      + '<div class="ord-top"><div><strong>' + esc(g.headliner || 'Gig') + '</strong> <small>\u00b7 ' + esc(o.quantity) + ' \u00d7 \u00a3' + esc((o.unit_price_pence/100).toFixed(2)) + ' = \u00a3' + esc(total) + '</small><br>'
      + esc(o.customer_name || '') + ' \u00b7 <strong>' + esc(o.customer_email || 'no email') + '</strong><br><small>' + esc(when) + ' \u00b7 ref ' + esc(o.id.slice(0,8).toUpperCase()) + '</small></div>'
      + '<div>' + (o.status === 'refunded' ? '<span class="badge">Refunded</span>' : emailBadge(o)) + '</div></div>'
      + tickets + actions + '</div>';
  }).join('');
}
document.getElementById('orderSearch').addEventListener('input', renderOrders);
document.getElementById('ordersRefresh').addEventListener('click', loadOrders);
document.getElementById('orderList').addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;
  const order = orders.find(o => o.id === btn.dataset.order);
  let body;
  if (act === 'resend'){
    if (!confirm('Resend the ticket email to ' + order.customer_email + '?')) return;
    body = { action:'resend', orderId:order.id };
  } else if (act === 'fix'){
    const next = prompt('Correct email address for this order:', order.customer_email || '');
    if (!next || next.trim().toLowerCase() === (order.customer_email || '').toLowerCase()) return;
    if (!confirm('Change the email to ' + next.trim() + ' and send the tickets there?')) return;
    body = { action:'resend', orderId:order.id, email:next.trim() };
  } else if (act === 'refund'){
    const amt = ((order.unit_price_pence * order.quantity) / 100).toFixed(2);
    if (!confirm('Refund \u00a3' + amt + ' to ' + order.customer_email + '?\n\nThis voids their tickets and puts them back on sale. It can\u2019t be undone.')) return;
    body = { action:'refund', orderId:order.id };
  } else if (act === 'checkin' || act === 'undo'){
    body = { action:'checkin', ticketId:btn.dataset.ticket, undo: act === 'undo' };
  } else return;

  document.querySelectorAll('#orderList button').forEach(b => b.disabled = true);
  orderMsg.style.color = '';
  try {
    await adminCall(body);
    orderMsg.textContent = 'Done.';
    await loadOrders();
    if (act === 'refund') loadGigs();
  } catch (err) {
    orderMsg.textContent = err.message;
    orderMsg.style.color = 'var(--red)';
    document.querySelectorAll('#orderList button').forEach(b => b.disabled = false);
  }
});

// ---- door scanner (camera -> QR -> admin-orders 'checkin_code') ----
const scanEls = {
  gig: document.getElementById('scanGig'), start: document.getElementById('scanStart'), stop: document.getElementById('scanStop'),
  box: document.getElementById('scanBox'), video: document.getElementById('scanVideo'), result: document.getElementById('scanResult'),
  manual: document.getElementById('scanManual'), manualGo: document.getElementById('scanManualGo'), count: document.getElementById('scanCount')
};
let scanStream = null, scanTimer = null, scanBusy = false, scanLast = { code:'', at:0 }, scanOk = 0, scanDetector = null, scanWake = null, scanAudio = null;
const scanCanvas = document.createElement('canvas');

function fillScanGigs(gigs){
  const keep = scanEls.gig.value;
  const today = new Date().toISOString().slice(0, 10);
  const live = (gigs || []).filter(g => !g.archived_at);
  const nearest = live.find(g => g.event_date >= today);
  scanEls.gig.innerHTML = '<option value="">Any gig (no check)</option>' + live.map(g =>
    '<option value="' + esc(g.id) + '">' + esc(g.headliner) + ' \u2013 ' + esc(g.event_date) + '</option>').join('');
  scanEls.gig.value = (keep && live.some(g => g.id === keep)) ? keep : (nearest ? nearest.id : '');
}
function showScan(kind, title, sub){
  scanEls.result.className = 'scan-result ' + kind;
  scanEls.result.innerHTML = '<strong>' + esc(title) + '</strong>' + (sub ? '<span>' + esc(sub) + '</span>' : '');
}
function scanFeedback(good){
  try { navigator.vibrate && navigator.vibrate(good ? 60 : [120, 60, 120]); } catch {}
  try {
    scanAudio = scanAudio || new (window.AudioContext || window.webkitAudioContext)();
    const beep = (freq, start, dur) => {
      const o = scanAudio.createOscillator(), g = scanAudio.createGain();
      o.frequency.value = freq; g.gain.value = 0.08; o.connect(g); g.connect(scanAudio.destination);
      o.start(scanAudio.currentTime + start); o.stop(scanAudio.currentTime + start + dur);
    };
    if (good) beep(880, 0, 0.12); else { beep(220, 0, 0.14); beep(220, 0.2, 0.14); }
  } catch {}
}
async function scanHandle(raw, manual){
  const code = String(raw || '').trim().toUpperCase();
  if (!code || scanBusy) return;
  if (!manual && code === scanLast.code && Date.now() - scanLast.at < 4000) return;   // same QR still in view
  scanBusy = true;
  try {
    const r = await adminCall({ action:'checkin_code', code, gigId: scanEls.gig.value || undefined });
    scanLast = { code, at: Date.now() };
    const who = [r.name, r.code].filter(Boolean).join(' \u00b7 ');
    if (r.result === 'ok'){
      scanOk++; scanEls.count.textContent = 'Checked in this session: ' + scanOk;
      showScan('ok', 'Checked in', who); scanFeedback(true); loadOrders();
    } else if (r.result === 'already'){
      const when = r.checkedInAt ? new Date(r.checkedInAt).toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' }) : '';
      showScan('warn', 'Already used', (when ? 'Checked in at ' + when + ' \u00b7 ' : '') + who); scanFeedback(false);
    } else if (r.result === 'void'){
      showScan('bad', 'Void \u2013 refunded', who); scanFeedback(false);
    } else if (r.result === 'wrong_gig'){
      showScan('bad', 'Wrong gig', r.message || ''); scanFeedback(false);
    } else {
      showScan('bad', 'Not recognised', r.message || 'No ticket with that code.'); scanFeedback(false);
    }
  } catch (err){
    showScan('bad', 'Couldn\u2019t check in', err.message + ' \u2013 scan again to retry.'); scanFeedback(false);
  }
  setTimeout(() => { scanBusy = false; }, 900);
}
function loadJsQR(){
  if (window.jsQR) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const el = document.createElement('script');
    el.src = '/admin/jsqr.min.js';
    el.onload = () => window.jsQR ? resolve() : reject(new Error('jsQR missing'));
    el.onerror = () => reject(new Error('jsQR failed to load'));
    document.head.appendChild(el);
  });
}
async function scanFrame(){
  if (scanBusy || !scanStream || scanEls.video.readyState < 2) return;
  try {
    let value = null;
    if (scanDetector){
      const found = await scanDetector.detect(scanEls.video);
      value = found && found[0] && found[0].rawValue;
    } else if (window.jsQR){
      const vw = scanEls.video.videoWidth, vh = scanEls.video.videoHeight;
      if (!vw || !vh) return;
      const k = Math.min(1, 640 / vw);
      scanCanvas.width = Math.round(vw * k); scanCanvas.height = Math.round(vh * k);
      const ctx = scanCanvas.getContext('2d', { willReadFrequently:true });
      ctx.drawImage(scanEls.video, 0, 0, scanCanvas.width, scanCanvas.height);
      const img = ctx.getImageData(0, 0, scanCanvas.width, scanCanvas.height);
      const hit = window.jsQR(img.data, img.width, img.height, { inversionAttempts:'dontInvert' });
      value = hit && hit.data;
    }
    if (value) scanHandle(value, false);
  } catch {}
}
async function startScan(){
  if (scanStream) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    showScan('bad', 'No camera access', 'This browser can\u2019t open the camera here. Type the ticket code below instead.'); return;
  }
  try {
    scanStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' } }, audio:false });
  } catch {
    showScan('bad', 'Camera blocked', 'Allow camera access for this site in your browser settings, or type the code below.'); return;
  }
  scanEls.video.srcObject = scanStream;
  try { await scanEls.video.play(); } catch {}
  scanEls.box.style.display = 'block'; scanEls.start.style.display = 'none'; scanEls.stop.style.display = '';
  scanDetector = null;
  if ('BarcodeDetector' in window){ try { scanDetector = new BarcodeDetector({ formats:['qr_code'] }); } catch { scanDetector = null; } }
  if (!scanDetector){
    try { await loadJsQR(); }
    catch { stopScan(); showScan('bad', 'Scanner unavailable', 'Camera scanning couldn\u2019t start here (jsqr.min.js missing?). Type the code below instead.'); return; }
  }
  try { scanWake = navigator.wakeLock ? await navigator.wakeLock.request('screen') : null; } catch { scanWake = null; }
  showScan('', 'Scanning\u2026', 'Hold a ticket QR code in view.');
  scanTimer = setInterval(scanFrame, 200);
}
function stopScan(){
  if (scanTimer){ clearInterval(scanTimer); scanTimer = null; }
  if (scanStream){ scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
  if (scanWake){ try { scanWake.release(); } catch {} scanWake = null; }
  scanEls.video.srcObject = null;
  scanEls.box.style.display = 'none'; scanEls.start.style.display = ''; scanEls.stop.style.display = 'none';
}
scanEls.start.addEventListener('click', startScan);
scanEls.stop.addEventListener('click', () => { stopScan(); showScan('', 'Ready', 'Start the camera and point it at a ticket QR code.'); });
scanEls.manualGo.addEventListener('click', () => { scanHandle(scanEls.manual.value, true); scanEls.manual.value = ''; });
scanEls.manual.addEventListener('keydown', (e) => { if (e.key === 'Enter'){ e.preventDefault(); scanEls.manualGo.click(); } });
document.addEventListener('visibilitychange', () => { if (document.hidden) stopScan(); });

// ---- gig list ----
document.getElementById('showArchived').addEventListener('change', () => loadGigs());
async function loadGigs(){
  const listEl = document.getElementById('gigList');
  const { data, error } = await sb
    .from('gigs')
    .select('*')
    .order('event_date', { ascending: true });

  if (error) {
    listEl.innerHTML = `<p class="empty-note">Couldn't load gigs - ${error.message}</p>`;
    return;
  }
  fillScanGigs(data);
  const showArchived = document.getElementById('showArchived').checked;
  const rows = (data || []).filter(g => showArchived || !g.archived_at);
  if (rows.length === 0) {
    listEl.innerHTML = '<p class="empty-note">' + ((data && data.length) ? 'No active gigs - tick "Show archived gigs" to see the rest.' : 'No gigs yet - add one above.') + '</p>';
    return;
  }

  listEl.innerHTML = rows.map(g => {
    const soldOut = g.tickets_remaining <= 0;
    const lowStock = g.availability === 'low';
    const dateStr = new Date(g.event_date + 'T00:00:00').toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
    return `
      <div class="gig-row" data-id="${g.id}"${g.archived_at ? ' style="opacity:0.55"' : ''}>
        <div class="gig-row-main">
          <strong>${g.headliner}${g.archived_at ? ' <span class="tag" style="display:inline">Archived</span>' : ''}</strong>
          <span>${dateStr} · ${g.venue}, ${g.city} · £${Number(g.price_gbp).toFixed(2)}
            ${soldOut ? '<span class="tag soldout">Sold out</span>' : (lowStock ? `<span class="tag low">${g.tickets_remaining} of ${g.capacity ?? '?'} left</span>` : `· ${g.tickets_remaining} of ${g.capacity ?? '?'} tickets left`)}
          </span>
        </div>
        <div class="gig-row-actions">
          <button type="button" class="secondary" data-edit="${g.id}">Edit</button>
          ${g.archived_at
            ? `<button type="button" class="secondary" data-restore="${g.id}">Restore</button>`
            : `<button type="button" class="secondary" data-archive="${g.id}">Archive</button>`}
          <button type="button" class="danger" data-delete="${g.id}">Delete</button>
        </div>
      </div>
    `;
  }).join('');

  listEl.querySelectorAll('[data-edit]').forEach(btn => {
    btn.addEventListener('click', () => {
      const gig = data.find(g => g.id === btn.dataset.edit);
      if (gig) fillForm(gig);
    });
  });
  listEl.querySelectorAll('[data-archive]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const gig = data.find(g => g.id === btn.dataset.archive);
      if (!gig) return;
      let warn = '';
      const { count } = await sb.from('orders').select('id', { count: 'exact', head: true }).eq('gig_id', gig.id).eq('status', 'paid');
      if (count > 0) warn = `\n\n${count} paid order${count === 1 ? '' : 's'} exist for this gig. Archiving does NOT refund anyone - refund them first if the gig is cancelled.`;
      if (!confirm(`Archive "${gig.headliner}"? It will be hidden from the public gigs page. Orders and tickets are kept, and you can restore it later.${warn}`)) return;
      const { error } = await sb.from('gigs').update({ archived_at: new Date().toISOString() }).eq('id', gig.id);
      if (error) { alert('Could not archive: ' + error.message); return; }
      loadGigs();
    });
  });
  listEl.querySelectorAll('[data-restore]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const gig = data.find(g => g.id === btn.dataset.restore);
      if (!gig) return;
      if (!confirm(`Restore "${gig.headliner}"? It will show on the public gigs page again if its date hasn't passed.`)) return;
      const { error } = await sb.from('gigs').update({ archived_at: null }).eq('id', gig.id);
      if (error) { alert('Could not restore: ' + error.message); return; }
      loadGigs();
    });
  });
  listEl.querySelectorAll('[data-delete]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const gig = data.find(g => g.id === btn.dataset.delete);
      if (!gig) return;
      if (!confirm(`Delete "${gig.headliner}"? This can't be undone.`)) return;
      const { error } = await sb.from('gigs').delete().eq('id', gig.id);
      if (error) {
        const fk = error.code === '23503' || /foreign key/i.test(error.message);
        alert(fk ? 'This gig has orders or tickets attached, so it can\'t be deleted. Use Archive instead - it hides the gig from the site and keeps the order history.' : 'Could not delete: ' + error.message);
        return;
      }
      loadGigs();
    });
  });
}
